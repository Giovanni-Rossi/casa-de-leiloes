name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Back-end (lint, formato, testes, cobertura 100%)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leilao
          POSTGRES_PASSWORD: leilao
          POSTGRES_DB: leilao_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leilao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://leilao:leilao@localhost:5432/leilao_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage

  frontend:
    name: Front-end (lint, formato, testes, cobertura 100%, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

  docker:
    name: Imagem Docker + teste de fumaça
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sobe a aplicação com Docker Compose
        run: docker compose up -d --build
      - name: Aguarda e verifica /api/health e o front-end
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then ok=1; break; fi
            sleep 2
          done
          [ "${ok:-}" = "1" ] || { docker compose logs app; exit 1; }
          curl -fsS http://localhost:3001/ | grep -q '<div id="root">'
          curl -fsS 'http://localhost:3001/api/lots?phase=live' | grep -q '"lots"'
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
